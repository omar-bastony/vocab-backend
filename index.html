<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1-A2 Kontext-Übersetzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="top-header fade-in">
      <div class="header-controls">
        
        <div class="dropdown-wrapper">
          <button id="materialMenuBtn" class="action-toggle-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>
            Lernmaterial
          </button>
          <div id="materialDropdown" class="custom-dropdown hidden">
             <div class="dropdown-category">Wortschatz</div>
             <button class="grammar-item material-btn" data-type="nomen">Nomen (Artikel & Plural)</button>
             <button class="grammar-item material-btn" data-type="adjektive">Adjektive (Steigerung)</button>
             <button class="grammar-item material-btn" data-type="verben">Verben (Zeiten)</button>
             <div class="dropdown-category">Praxis</div>
             <button class="grammar-item material-btn" data-type="lesetexte">Lesetexte</button>
          </div>
        </div>

        <div class="dropdown-wrapper">
          <button id="grammarMenuBtn" class="action-toggle-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            Grammatik
          </button>
          <div id="grammarDropdown" class="custom-dropdown hidden">
             <div class="dropdown-category">A1 Grammatik</div>
             <button class="grammar-item" data-topic="pronomen">Pronomen, sein & haben</button>
             <button class="grammar-item" data-topic="kasus">Artikel & Kasus</button>
             <button class="grammar-item" data-topic="fragen">Fragen stellen</button>
             
             <div class="dropdown-category">A2 Grammatik</div>
             <button class="grammar-item" data-topic="perfekt">Das Perfekt</button>
             <button class="grammar-item" data-topic="praeteritum">Das Präteritum</button>
             <button class="grammar-item" data-topic="nebensaetze">Nebensätze</button>
             <button class="grammar-item" data-topic="wechselpraep">Wechselpräpositionen</button>
             <button class="grammar-item" data-topic="komparativ">Komparativ & Superlativ</button>
          </div>
        </div>

        <div class="dropdown-wrapper">
          <button id="langMenuBtn" class="action-toggle-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            Sprachen
          </button>
          <div id="langDropdown" class="custom-dropdown hidden" style="width: 300px;">
            <div id="langCheckboxes" class="lang-checkbox-grid"></div>
          </div>
        </div>
      </div>
    </header>

    <section class="central-box fade-in">
      <div class="central-left">
        <div class="input-group">
          <div class="m3-textfield">
            <textarea id="germanInput" placeholder=" " rows="1"></textarea>
            <label for="germanInput">Deutsches Wort</label>
          </div>
          <button id="translateBtn" class="m3-button">Übersetzen</button>
        </div>
        
        <div id="umlautSuggestion" class="umlaut-suggestion hidden">
          Meintest du: <span id="suggestionText" class="suggestion-chip"></span>?
        </div>

        <div id="wordDetailsArea" class="word-details-inner" style="display: none;">
          <div class="title-row">
            <h2 id="germanWordTitle" class="main-word"></h2>
            <button id="germanSpeakBtn" class="speak-btn hidden" aria-label="Aussprache anhören" title="Aussprache anhören">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
          </div>
          <div id="grammarTips" class="grammar-tips"></div>
          <p id="germanExample" class="german-example"></p>
        </div>
      </div>

      <div class="central-right">
        <div class="central-image-container">
           <div id="mainImageShimmer" class="image-shimmer shimmer" style="display: none;"></div>
           <img id="centralImage" class="dynamic-image" src="https://placehold.co/600x400/f0f0f0/888888?text=Übersetzung" alt="Visual Context">
        </div>
      </div>
    </section>

    <section class="output-section">
      <div id="translationGrid" class="translation-grid"></div>
    </section>
  </main>

  <div id="grammarModal" class="modal-overlay hidden">
    <div class="modal-content modal-content-large">
      <button id="closeModalBtn" class="close-modal-btn">&times;</button>
      
      <div id="printableArea">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalBody" class="modal-body"></div>
      </div>
      
      <div id="modalActions" class="modal-actions hidden">
         <button id="printBtn" class="m3-button secondary-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="margin-right: 8px;"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Drucken
         </button>
         <button id="generateAiBtn" class="m3-button hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="margin-right: 8px;"><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path><path d="M4.93 19.07l2.83-2.83"></path><path d="M16.24 7.76l2.83-2.83"></path></svg>
            Neuen Text generieren (KI)
         </button>
      </div>

    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
